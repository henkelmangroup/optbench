[Main]
job = saddle_search
finite_difference=0.001

[Potential]
potential = lammps

[Optimizer]
opt_method=cg
lbfgs_auto_scale=true
lbfgs_memory=30
max_move=0.1
converged_force = 0.001
max_iterations = 5000

[Saddle Search]
min_mode_method=dimer

[Dimer]
converged_angle=0.10
rotations_max=20

[Lanczos]
tolerence=0.10
max_iterations=10
