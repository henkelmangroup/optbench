[Main]
job = parallel_replica 
temperature = 300                  
random_seed = 1031
quiet = true

[Potential]
potential = eam_al                

[Communicator]
type = cluster                     
client_path =../../client/client 
number_of_cpus = 1
num_jobs = 5000

[Dynamics]
time_step = 1.0                 
time = 5000000.0                     
thermostat = langevin              
langevin_friction = 0.02

[Debug]
keep_all_result_files = True

[Parallel Replica]
dephase_time = 20000.0              
state_check_interval = 1000.0   
state_save_interval  = 100.0      
post_transition_time = 700.0     
stop_after_transition = true  

[Optimizer]
opt_method = cg               
converged_force = 0.01

