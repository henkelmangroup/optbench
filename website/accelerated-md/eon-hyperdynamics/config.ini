[Main]
job = parallel_replica 
temperature = 300                  
random_seed = 1031
quiet = true

[Potential]
potential = eam_al                

[Communicator]
type = cluster                     
client_path =../../client/client 
number_of_cpus = 1
num_jobs = 5000

[Dynamics]
time_step = 1.0                 
time = 5000000.0                     
thermostat = langevin              
langevin_friction = 0.02

[Debug]
keep_all_result_files = True

[Parallel Replica]
dephase_time = 20000.0              
state_check_interval = 1000.0   
state_save_interval  = 100.0      
post_transition_time = 700.0     
stop_after_transition = true  

[Optimizer]
opt_method = cg               
converged_force = 0.01

[Hyperdynamics]
bias_potential=bond_boost       ; bond_boost bias potential
bb_boost_atomlist=20,26,50,56,150 ; atoms that are boosted in the bias potential
bb_rcut=3.0                     ; boost radius
bb_rmd_time=100.0               ; MD time to obtain the equilibrium configuration
bb_dvmax=0.2                    ; magnitude of the bond-boost bias potential
bb_stretch_threshold=0.2        ; defines the bond-boost dividing surface
bb_ds_curvature=0.95            ; curvature near the bond-boost dividing surface, it should be <= 1; a value of 0.9-0.98 is recommended

